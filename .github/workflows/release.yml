name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - name: Build skill ZIP
        working-directory: skills
        run: zip -r ../scriptable-widget.zip scriptable-widget
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" scriptable-widget.zip "scriptable/Widget Installer.js" --title "$GITHUB_REF_NAME" --generate-notes
